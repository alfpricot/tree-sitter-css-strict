# gala release configuration. gala bumps Cargo.toml, package.json, and
# tree-sitter.json together, refreshes package-lock.json, and regenerates
# the parser, so the release commit is exactly what release.yml
# publishes. publish = false because release.yml publishes to crates.io and
# npm, and githubRelease = false because release.yml's final job already
# creates the GitHub Release.
kind = "app"
manager = "cargo"
publish = false
githubRelease = false
releaseBranches = ["main"]
syncBranch = "dev"
tagPrefix = "v"
changelog = "CHANGELOG.md"
remote = "origin"

# The generated parser embeds tree-sitter.json's version, so the release
# commit regenerates it with the CLI version package.json pins; Verify's
# generated-parser check then passes on the release commit too.
postBump = ["npx --no-install tree-sitter generate"]
postBumpPaths = ["src/parser.c", "src/grammar.json", "src/node-types.json"]

[[versionFile]]
path = "package.json"
key = "version"

[[versionFile]]
path = "tree-sitter.json"
key = "metadata.version"
