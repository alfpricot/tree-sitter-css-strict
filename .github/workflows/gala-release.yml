# =============================================================================
#  tree-sitter-css-strict · GitHub Actions
# -----------------------------------------------------------------------------
#  File                gala-release.yml
#  Workflow name       Gala release
#  Type                Entrypoint (runs in this repo only)
#  Triggers            push (main branch)
#                      workflow_dispatch
#  Purpose             Cuts a release when a promotion lands on main. gala
#                      reads the Conventional Commits since the last tag,
#                      writes CHANGELOG.md, bumps the Cargo.toml version,
#                      commits "chore(release): vX.Y.Z", tags it, pushes main
#                      and the tag atomically, and fast-forwards dev to the
#                      release commit. It does nothing when no release is due.
#
#                      The pushes go over the RELEASE_DEPLOY_KEY deploy key:
#                      the rulesets block direct pushes to main and dev and
#                      creating v* tags, and the deploy key is the bypass
#                      actor available to a workflow on this personal-account
#                      repository. gala's release commit carries a skip-ci
#                      marker so it does not re-run workflows, and that marker
#                      also keeps the tag push from firing release.yml. This
#                      workflow therefore dispatches release.yml with the new
#                      tag itself (release.yml's publish steps are safe to
#                      repeat, so a duplicate trigger is harmless).
#
#                      The generated parser embeds the version from
#                      tree-sitter.json, which gala never touches, so the
#                      release commit leaves src/parser.c unchanged and
#                      Verify's generated-parser check keeps passing.
# =============================================================================

name: Gala release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gala-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GALA_VERSION: 'v0.2.0'

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # Job-level elevation: the git pushes authenticate with the deploy key, so
    # contents stays read; actions: write is only for dispatching release.yml.
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (gala reads tags and history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # origin becomes an SSH remote authenticated by the deploy key, so
          # gala's atomic push and dev sync use the ruleset bypass.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # gala v0.2.0 needs Go 1.27.3 or newer.
          go-version: '1.27.3'
      - name: Install gala
        run: go install "github.com/alfpricot/gala/cmd/gala@${GALA_VERSION}"
      - name: Install Rust toolchain
        # gala's cargo manager runs cargo to write the version and refresh Cargo.lock.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1.97.0
      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gala release
      - name: Find the tag this run created
        id: tag
        # Empty when no release was due: HEAD is then an ordinary commit with
        # no release tag on it.
        run: echo "tag=$(git tag --points-at HEAD --list 'v[0-9]*' | head -n1)" >> "$GITHUB_OUTPUT"
      - name: Dispatch the publish workflow
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run release.yml --ref main -f "tag=${TAG}"
